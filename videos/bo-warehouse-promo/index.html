<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #f8f9fa;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="17.515"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6.16"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="5.76"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-solution"
        class="scene"
        data-composition-id="02-solution"
        data-composition-src="compositions/frames/02-solution.html"
        data-start="5.76"
        data-duration="5.556"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-solution-voice"
        src="assets/voice/02.wav"
        data-start="5.76"
        data-duration="5.056"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-cta"
        class="scene"
        data-composition-id="03-cta"
        data-composition-src="compositions/frames/03-cta.html"
        data-start="10.815999999999999"
        data-duration="6.699"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-cta-voice"
        src="assets/voice/03.wav"
        data-start="10.815999999999999"
        data-duration="6.699"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="17.515"
        data-track-index="2"
      ></div>

      <!-- SFX -->
      <audio
        id="el-sfx-0"
        src="assets/sfx/riser.mp3"
        data-start="0"
        data-duration="10.03"
        data-track-index="20"
        data-volume="0.35"
      ></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 5.76);
        tl.fromTo("#el-02-solution", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 5.76);
        tl.to("#el-02-solution", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10.816);
        tl.fromTo("#el-03-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10.816);
        tl.to({}, { duration: 17.515 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
